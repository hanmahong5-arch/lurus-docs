<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7"/>
      <stop offset="100%" style="stop-color:#A29BFE"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="#FCFCFD"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#2D3436">7 种接入方式，配置全平台同步</text>

  <!-- Center node -->
  <circle cx="400" cy="270" r="64" fill="url(#centerGrad)" filter="url(#shadow)"/>
  <text x="400" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">Claude</text>
  <text x="400" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">Code</text>

  <!-- Connection lines -->
  <g stroke="#DDD" stroke-width="1.5" fill="none" stroke-dasharray="6,4">
    <line x1="336" y1="270" x2="170" y2="140"/>
    <line x1="336" y1="270" x2="170" y2="270"/>
    <line x1="336" y1="270" x2="170" y2="400"/>
    <line x1="464" y1="270" x2="630" y2="110"/>
    <line x1="464" y1="270" x2="630" y2="230"/>
    <line x1="464" y1="270" x2="630" y2="350"/>
    <line x1="400" y1="334" x2="400" y2="460"/>
  </g>

  <!-- Left nodes -->
  <g filter="url(#shadow)">
    <rect x="60" y="112" width="140" height="56" rx="12" fill="url(#nodeGrad)" stroke="#E0E0E0" stroke-width="1"/>
    <text x="95" y="138" font-size="20">&#x1F4BB;</text>
    <text x="120" y="148" font-size="13" font-weight="600" fill="#2D3436">Terminal CLI</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="60" y="242" width="140" height="56" rx="12" fill="url(#nodeGrad)" stroke="#E0E0E0" stroke-width="1"/>
    <text x="95" y="268" font-size="20">&#x1F3A8;</text>
    <text x="120" y="278" font-size="13" font-weight="600" fill="#2D3436">IDE 插件</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="60" y="372" width="140" height="56" rx="12" fill="url(#nodeGrad)" stroke="#E0E0E0" stroke-width="1"/>
    <text x="95" y="398" font-size="20">&#x1F5A5;</text>
    <text x="120" y="408" font-size="13" font-weight="600" fill="#2D3436">桌面应用</text>
  </g>

  <!-- Right nodes -->
  <g filter="url(#shadow)">
    <rect x="600" y="82" width="140" height="56" rx="12" fill="url(#nodeGrad)" stroke="#E0E0E0" stroke-width="1"/>
    <text x="635" y="108" font-size="20">&#x1F310;</text>
    <text x="660" y="118" font-size="13" font-weight="600" fill="#2D3436">Web 版</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="202" width="140" height="56" rx="12" fill="url(#nodeGrad)" stroke="#E0E0E0" stroke-width="1"/>
    <text x="635" y="228" font-size="20">&#x2699;</text>
    <text x="660" y="238" font-size="13" font-weight="600" fill="#2D3436">CI/CD</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="322" width="140" height="56" rx="12" fill="url(#nodeGrad)" stroke="#E0E0E0" stroke-width="1"/>
    <text x="635" y="348" font-size="20">&#x1F4AC;</text>
    <text x="660" y="358" font-size="13" font-weight="600" fill="#2D3436">Slack</text>
  </g>

  <!-- Bottom node -->
  <g filter="url(#shadow)">
    <rect x="330" y="448" width="140" height="56" rx="12" fill="url(#nodeGrad)" stroke="#E0E0E0" stroke-width="1"/>
    <text x="365" y="474" font-size="20">&#x1F4F1;</text>
    <text x="390" y="484" font-size="13" font-weight="600" fill="#2D3436">Agent SDK</text>
  </g>

  <!-- Sync badge -->
  <rect x="310" y="178" width="180" height="28" rx="14" fill="#00B894" opacity="0.9"/>
  <text x="400" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#FFF">CLAUDE.md / MCP / Skills 全同步</text>
</svg>
