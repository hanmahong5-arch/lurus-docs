<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <filter id="s4" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arr4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#636E72"/>
    </marker>
  </defs>

  <rect width="800" height="300" rx="16" fill="#FCFCFD"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#2D3436">Hooks 工作流</text>

  <!-- Timeline bar -->
  <rect x="60" y="135" width="680" height="4" rx="2" fill="#DFE6E9"/>

  <!-- Pre-hook -->
  <g filter="url(#s4)">
    <rect x="80" y="90" width="150" height="50" rx="10" fill="#FFEAA7" stroke="#FDCB6E" stroke-width="1.5"/>
    <text x="155" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#333">&#x26A1; Pre-Hook</text>
    <text x="155" y="128" text-anchor="middle" font-size="10" fill="#666">拦截 / 注入上下文</text>
  </g>

  <!-- Action -->
  <g filter="url(#s4)">
    <rect x="290" y="80" width="180" height="60" rx="12" fill="#6C5CE7"/>
    <text x="380" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">Claude 执行动作</text>
    <text x="380" y="128" text-anchor="middle" font-size="11" fill="#D5D0F5">编辑 / 命令 / 提交</text>
  </g>

  <!-- Post-hook -->
  <g filter="url(#s4)">
    <rect x="530" y="90" width="150" height="50" rx="10" fill="#55EFC4" stroke="#00B894" stroke-width="1.5"/>
    <text x="605" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#333">&#x2699; Post-Hook</text>
    <text x="605" y="128" text-anchor="middle" font-size="10" fill="#666">格式化 / lint / 通知</text>
  </g>

  <!-- Arrows on timeline -->
  <g fill="none" stroke="#636E72" stroke-width="1.5" marker-end="url(#arr4)">
    <line x1="232" y1="137" x2="288" y2="137"/>
    <line x1="472" y1="137" x2="528" y2="137"/>
  </g>

  <!-- Examples below -->
  <g font-size="11" fill="#636E72">
    <text x="80" y="175" font-weight="600" fill="#E17055">Pre 场景</text>
    <text x="80" y="195">&#x2022; 阻止修改 .env 等敏感文件</text>
    <text x="80" y="213">&#x2022; compact 后自动注入上下文</text>
    <text x="80" y="231">&#x2022; 自动审批特定权限请求</text>

    <text x="480" y="175" font-weight="600" fill="#E17055">Post 场景</text>
    <text x="480" y="195">&#x2022; 文件保存后自动 Prettier</text>
    <text x="480" y="213">&#x2022; 提交前跑 eslint / golangci</text>
    <text x="480" y="231">&#x2022; 需要输入时通知 Slack</text>
  </g>

  <!-- Hook types badge -->
  <g transform="translate(240,255)">
    <rect width="320" height="28" rx="14" fill="#F0F0F0"/>
    <text x="160" y="19" text-anchor="middle" font-size="11" fill="#636E72">
      支持: Shell &#x2022; Prompt &#x2022; Agent &#x2022; HTTP
    </text>
  </g>
</svg>
