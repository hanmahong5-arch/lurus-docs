<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <filter id="s5" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arr5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6C5CE7"/>
    </marker>
    <marker id="arr5g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00B894"/>
    </marker>
  </defs>

  <rect width="800" height="420" rx="16" fill="#FCFCFD"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#2D3436">并行 Agent + Git Worktree</text>

  <!-- Lead Agent -->
  <g filter="url(#s5)">
    <rect x="290" y="60" width="220" height="64" rx="14" fill="#6C5CE7"/>
    <text x="400" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">&#x1F451; Lead Agent</text>
    <text x="400" y="108" text-anchor="middle" font-size="11" fill="#D5D0F5">拆分任务 / 分配 / 合并</text>
  </g>

  <!-- Fan-out lines -->
  <g fill="none" stroke="#6C5CE7" stroke-width="1.5" marker-end="url(#arr5)">
    <line x1="340" y1="124" x2="140" y2="180"/>
    <line x1="400" y1="124" x2="400" y2="180"/>
    <line x1="460" y1="124" x2="660" y2="180"/>
  </g>

  <!-- Worker 1 -->
  <g filter="url(#s5)">
    <rect x="50" y="185" width="180" height="100" rx="12" fill="#FFF" stroke="#0984E3" stroke-width="1.5"/>
    <text x="140" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#0984E3">Worker A</text>
    <line x1="70" y1="220" x2="210" y2="220" stroke="#EEE" stroke-width="1"/>
    <text x="75" y="240" font-size="11" fill="#636E72">&#x1F33F; branch: feat/auth</text>
    <text x="75" y="258" font-size="11" fill="#636E72">&#x1F4C2; worktree 隔离</text>
    <text x="75" y="276" font-size="11" fill="#636E72">&#x1F527; 重构认证模块</text>
  </g>

  <!-- Worker 2 -->
  <g filter="url(#s5)">
    <rect x="310" y="185" width="180" height="100" rx="12" fill="#FFF" stroke="#0984E3" stroke-width="1.5"/>
    <text x="400" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#0984E3">Worker B</text>
    <line x1="330" y1="220" x2="470" y2="220" stroke="#EEE" stroke-width="1"/>
    <text x="335" y="240" font-size="11" fill="#636E72">&#x1F33F; branch: feat/api</text>
    <text x="335" y="258" font-size="11" fill="#636E72">&#x1F4C2; worktree 隔离</text>
    <text x="335" y="276" font-size="11" fill="#636E72">&#x1F527; 新增 API 接口</text>
  </g>

  <!-- Worker 3 -->
  <g filter="url(#s5)">
    <rect x="570" y="185" width="180" height="100" rx="12" fill="#FFF" stroke="#0984E3" stroke-width="1.5"/>
    <text x="660" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#0984E3">Worker C</text>
    <line x1="590" y1="220" x2="730" y2="220" stroke="#EEE" stroke-width="1"/>
    <text x="595" y="240" font-size="11" fill="#636E72">&#x1F33F; branch: fix/tests</text>
    <text x="595" y="258" font-size="11" fill="#636E72">&#x1F4C2; worktree 隔离</text>
    <text x="595" y="276" font-size="11" fill="#636E72">&#x1F527; 修复测试用例</text>
  </g>

  <!-- Fan-in lines -->
  <g fill="none" stroke="#00B894" stroke-width="1.5" marker-end="url(#arr5g)">
    <line x1="140" y1="285" x2="340" y2="340"/>
    <line x1="400" y1="285" x2="400" y2="340"/>
    <line x1="660" y1="285" x2="460" y2="340"/>
  </g>

  <!-- Merge result -->
  <g filter="url(#s5)">
    <rect x="290" y="345" width="220" height="50" rx="25" fill="#00B894"/>
    <text x="400" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">&#x1F389; 自动合并到 main</text>
  </g>
</svg>
