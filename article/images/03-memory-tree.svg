<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <filter id="s3" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="700" height="480" rx="16" fill="#FCFCFD"/>
  <text x="350" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#2D3436">双层记忆系统</text>

  <!-- Left tree: CLAUDE.md hierarchy -->
  <text x="190" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#6C5CE7">显式记忆 CLAUDE.md</text>
  <text x="190" y="90" text-anchor="middle" font-size="11" fill="#999">层级继承，子目录可补充不可覆盖</text>

  <!-- Tree lines -->
  <g stroke="#D5D0F5" stroke-width="2" fill="none">
    <line x1="190" y1="130" x2="190" y2="160"/>
    <line x1="190" y1="190" x2="190" y2="220"/>
    <line x1="190" y1="250" x2="190" y2="280"/>
    <line x1="190" y1="310" x2="190" y2="340"/>
  </g>

  <!-- Level 0 -->
  <g filter="url(#s3)">
    <rect x="100" y="108" width="180" height="42" rx="8" fill="#F8F7FF" stroke="#6C5CE7" stroke-width="1.5"/>
    <text x="130" y="134" font-size="13" fill="#6C5CE7">&#x1F30D;</text>
    <text x="150" y="134" font-size="12" font-weight="600" fill="#2D3436">~/.claude/CLAUDE.md</text>
  </g>
  <text x="310" y="134" font-size="11" fill="#999">个人习惯 / 通用规则</text>

  <!-- Level 1 -->
  <g filter="url(#s3)">
    <rect x="115" y="168" width="180" height="42" rx="8" fill="#F0EEFF" stroke="#6C5CE7" stroke-width="1.5"/>
    <text x="145" y="194" font-size="13" fill="#6C5CE7">&#x1F3E2;</text>
    <text x="165" y="194" font-size="12" font-weight="600" fill="#2D3436">lurus/CLAUDE.md</text>
  </g>
  <text x="325" y="194" font-size="11" fill="#999">团队架构 / 编码规范</text>

  <!-- Level 2 -->
  <g filter="url(#s3)">
    <rect x="130" y="228" width="180" height="42" rx="8" fill="#E8E5FF" stroke="#6C5CE7" stroke-width="1.5"/>
    <text x="160" y="254" font-size="13" fill="#6C5CE7">&#x1F4E6;</text>
    <text x="180" y="254" font-size="12" font-weight="600" fill="#2D3436">service/CLAUDE.md</text>
  </g>
  <text x="340" y="254" font-size="11" fill="#999">服务专属上下文</text>

  <!-- Level 3 -->
  <g filter="url(#s3)">
    <rect x="145" y="288" width="180" height="42" rx="8" fill="#DDD8FF" stroke="#6C5CE7" stroke-width="1.5"/>
    <text x="175" y="314" font-size="13" fill="#6C5CE7">&#x1F4C1;</text>
    <text x="195" y="314" font-size="12" font-weight="600" fill="#2D3436">.claude/rules/*.md</text>
  </g>
  <text x="355" y="314" font-size="11" fill="#999">路径级规则</text>

  <!-- Inheritance arrow -->
  <text x="80" y="230" font-size="20" fill="#D5D0F5">&#x2193;</text>
  <text x="56" y="218" font-size="9" fill="#B0A8E6" transform="rotate(-90,56,218)">继承</text>

  <!-- Right side: Auto Memory -->
  <text x="530" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#00B894">隐式记忆 Auto Memory</text>
  <text x="530" y="90" text-anchor="middle" font-size="11" fill="#999">从对话中自动学习，跨会话保留</text>

  <g filter="url(#s3)">
    <rect x="440" y="115" width="180" height="46" rx="10" fill="#F0FFF4" stroke="#00B894" stroke-width="1.5"/>
    <text x="470" y="143" font-size="13">&#x1F464;</text>
    <text x="492" y="143" font-size="12" font-weight="600" fill="#2D3436">用户画像</text>
  </g>

  <g filter="url(#s3)">
    <rect x="440" y="175" width="180" height="46" rx="10" fill="#F0FFF4" stroke="#00B894" stroke-width="1.5"/>
    <text x="470" y="203" font-size="13">&#x1F4DD;</text>
    <text x="492" y="203" font-size="12" font-weight="600" fill="#2D3436">行为反馈</text>
  </g>

  <g filter="url(#s3)">
    <rect x="440" y="235" width="180" height="46" rx="10" fill="#F0FFF4" stroke="#00B894" stroke-width="1.5"/>
    <text x="470" y="263" font-size="13">&#x1F4CB;</text>
    <text x="492" y="263" font-size="12" font-weight="600" fill="#2D3436">项目状态</text>
  </g>

  <g filter="url(#s3)">
    <rect x="440" y="295" width="180" height="46" rx="10" fill="#F0FFF4" stroke="#00B894" stroke-width="1.5"/>
    <text x="470" y="323" font-size="13">&#x1F517;</text>
    <text x="492" y="323" font-size="12" font-weight="600" fill="#2D3436">外部资源引用</text>
  </g>

  <!-- Divider -->
  <line x1="390" y1="65" x2="390" y2="360" stroke="#EEE" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bottom: how they merge -->
  <g filter="url(#s3)">
    <rect x="170" y="390" width="360" height="56" rx="28" fill="#6C5CE7"/>
    <text x="350" y="418" text-anchor="middle" font-size="13" font-weight="600" fill="#FFF">&#x1F9E9;  两层记忆在每次会话启动时自动合并加载</text>
    <text x="350" y="436" text-anchor="middle" font-size="11" fill="#D5D0F5">/memory 随时查看和编辑</text>
  </g>

  <g stroke="#CCC" stroke-width="1.5" fill="none" stroke-dasharray="4,3">
    <line x1="250" y1="340" x2="300" y2="390"/>
    <line x1="530" y1="345" x2="440" y2="390"/>
  </g>
</svg>
