version: '3.9'

# Pre-production stack for 43.226.38.244 (lurus-infra tenant).
# Build locally with `docker compose build`, then `docker compose up -d`.
# Bind to 127.0.0.1 — expose via host nginx or Tailscale as needed.

services:
  docs:
    build:
      context: ../
      dockerfile: Dockerfile.staging
    image: lurus-docs:staging
    container_name: lurus-docs-staging
    restart: unless-stopped
    ports:
      - "100.122.83.20:8880:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - docs-staging-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  docs-staging-data:
