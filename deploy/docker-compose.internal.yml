# Lurus Internal docs — R6 deployment under lurus-infra slice.
# Bind to Tailscale IP only (100.122.83.20) — team accesses via tailnet.
# Public exposure (DNS + cert + oauth2-proxy) is a separate decision.
#
# Build on R6:  cd /data/lurus-infra/docs-internal/deploy && docker compose up -d --build
#
# Docs-staging (public-facing draft of docs.lurus.cn) is at 8880.
# This internal site lives on 8881 to coexist on the same host.

services:
  internal:
    build:
      context: ../
      dockerfile: Dockerfile.internal
    image: lurus-docs-internal:latest
    container_name: lurus-docs-internal
    restart: unless-stopped
    ports:
      - "100.122.83.20:8881:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
