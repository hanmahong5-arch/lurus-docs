# Lurus Internal docs — nginx config
# Static-only serving with SPA fallback. No external requests, no upstream.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't index — internal site
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Cache assets aggressively (VitePress hashes filenames)
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache fonts / svg / png with shorter ttl
    location ~* \.(woff2?|svg|png|jpe?g|gif|ico)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA-style routing — VitePress generates static .html per page,
    # but cleanUrls means /products/platform should serve products/platform.html
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Health check for compose / future probe
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Hide nginx version
    server_tokens off;

    # Reasonable upload limit (no uploads expected, but defensive)
    client_max_body_size 1m;
}
