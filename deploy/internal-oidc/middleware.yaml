apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lurus-internal-forwardauth
  namespace: lurus-system
spec:
  forwardAuth:
    address: http://oauth2-proxy-internal.lurus-system.svc:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
      - Authorization
